name: Check, rehearse, and publish site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub Pages (main only); leave unchecked for rehearsal
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require main for a manual publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref != 'refs/heads/main'
        run: |
          echo 'Choose main when publishing. Other branches can rehearse only.'
          exit 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: experiments/*/requirements.txt
      - name: Install pinned calculation dependencies
        run: python -m pip install -r experiments/field-1965/requirements.txt -r experiments/fgh-1969/requirements.txt -r experiments/takayanagi-nishimura-1960/requirements.txt -r experiments/iwasaki-2012/requirements.txt -r experiments/schwarz-1972/requirements.txt -r experiments/ki-2002/requirements.txt
      - name: Recompute and validate all three figures
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python experiments/field-1965/publish.py
      - name: Recompute FGH models and original-figure comparison
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python experiments/fgh-1969/publish.py
      - name: Recompute the cooling-medium linear prototype
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python experiments/schwarz-1972/publish.py
      - name: Recompute the historical H2 rate audit
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python experiments/takayanagi-nishimura-1960/publish.py
      - name: Recompute the steady front-classification prototypes
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python experiments/iwasaki-2012/publish.py
      - name: Recompute corrected KI equilibrium and ZP saturation
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python experiments/ki-2002/publish.py
      - name: Build the research reading paths
        run: python scripts/build_reading.py
      - name: Build model-specific equilibrium landmark registry
        run: python scripts/build_landmarks.py
      - name: Check site links, downloads, and provenance
        run: |
          node --check docs/app.js
          python scripts/check_site.py
      - name: Save a downloadable rehearsal artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-rehearsal
          path: docs/
          if-no-files-found: error
          retention-days: 7
      - name: Configure Pages
        if: (github.event_name == 'push' && vars.PAGES_AUTO_DEPLOY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
        uses: actions/configure-pages@v5
      - name: Upload Pages site
        if: (github.event_name == 'push' && vars.PAGES_AUTO_DEPLOY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

  deploy:
    if: (github.event_name == 'push' && vars.PAGES_AUTO_DEPLOY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-production
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish validated site
        id: deployment
        uses: actions/deploy-pages@v4
